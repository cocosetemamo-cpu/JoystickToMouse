name: Build JoystickToMouse

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar ImageMagick
        shell: pwsh
        run: |
          choco install imagemagick -y

      - name: Extraer SVG
        shell: pwsh
        run: |
          $cpp = Get-Content "joysticktomouse.cpp" -Raw

          $start = $cpp.IndexOf('R"svg(')

          if ($start -lt 0) {
              throw "No se encontro el inicio del SVG."
          }

          $start += 6

          $end = $cpp.IndexOf(')svg"', $start)

          if ($end -lt 0) {
              throw "No se encontro el final del SVG."
          }

          $svg = $cpp.Substring($start, $end - $start)

          [System.IO.File]::WriteAllText(
              "JoystickToMouse.svg",
              $svg,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "SVG extraido correctamente."

      - name: Crear ICO
        shell: pwsh
        run: |
          magick "JoystickToMouse.svg" `
            -background none `
            -define icon:auto-resize=256,128,64,48,32,16 `
            "JoystickToMouse.ico"

          if (!(Test-Path "JoystickToMouse.ico")) {
              throw "No se pudo crear JoystickToMouse.ico"
          }

          Write-Host "ICO creado correctamente."

      - name: Encontrar Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (!$vsPath) {
              throw "No se encontro Visual Studio con C++."
          }

          Write-Host "Visual Studio encontrado:"
          Write-Host $vsPath

          "VS_PATH=$vsPath" >> $env:GITHUB_ENV

      - name: Configurar compilador
        shell: cmd
        run: |
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          echo PATH=%PATH%>>"%GITHUB_ENV%"
          echo INCLUDE=%INCLUDE%>>"%GITHUB_ENV%"
          echo LIB=%LIB%>>"%GITHUB_ENV%"

      - name: Compilar recurso
        shell: cmd
        run: |
          rc.exe resource.rc

          if errorlevel 1 (
            echo ERROR: No se pudo compilar resource.rc
            exit /b 1
          )

      - name: Compilar JoystickToMouse
        shell: cmd
        run: |
          cl.exe /EHsc /O2 joysticktomouse.cpp resource.res /Fe:JoystickToMouse.exe user32.lib winmm.lib

          if errorlevel 1 (
            echo ERROR: No se pudo compilar JoystickToMouse
            exit /b 1
          )

      - name: Guardar EXE
        uses: actions/upload-artifact@v4
        with:
          name: JoystickToMouse
          path: JoystickToMouse.exe
